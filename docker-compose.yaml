services:
  telegram:
    build:
      context: .
      args:
        GITHUB_TOKEN: ${GITHUB_TOKEN:-}
    container_name: costaff-channel-telegram
    restart: always
    environment:
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - ADK_API_BASE_URL=http://costaff-agent-costaff:8080
      - ADK_APP_NAME=costaff_agent
      - COSTAFF_PREFERRED_LANGUAGE=${COSTAFF_PREFERRED_LANGUAGE}
      - ADK_SESSION_SERVICE_URI=${ADK_SESSION_SERVICE_URI}
      # Plan B: channel reads/writes from shared workspace
      - SHARED_DIR=/app/data/shared
    # Note: actual bind mounts are injected by the CoStaff CLI in compose-fragment.yaml
    networks:
      - costaff_default

networks:
  costaff_default:
    external: true
